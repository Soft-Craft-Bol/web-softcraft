<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>revision movil</title>
<style>
  body { margin: 0; background: #000; color: #fcbf02; font: 12px system-ui, sans-serif; }
  .bar { padding: 4px 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .holder { width: 390px; height: 780px; overflow: hidden; background: #000; position: relative; }
  iframe { width: 390px; height: 780px; border: 0; display: block; }
</style>
</head>
<body>
<div class="bar" id="bar">/</div>
<div class="holder"><iframe id="m" src="/"></iframe></div>
<script>
  const route = new URLSearchParams(location.search).get('r') || '/';
  document.getElementById('bar').textContent = route;
  document.getElementById('m').src = route;
  window.scrollFrame = (y) => document.getElementById('m').contentWindow.scrollTo(0, y);
</script>
</body>
</html>
