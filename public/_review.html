<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>revision</title>
<style>
  body { margin: 0; background: #000; color: #fcbf02; font: 12px system-ui, sans-serif; }
  .bar { padding: 3px 8px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .holder { overflow: hidden; background: #000; position: relative; }
</style>
</head>
<body>
<div class="bar" id="bar">/</div>
<div class="holder" id="holder"></div>
<script>
  const p = new URLSearchParams(location.search);
  const route = p.get('r') || '/';
  const y = Number(p.get('y') || 0);
  const theme = p.get('t') === 'light' ? 'light' : 'dark';
  const mobile = p.get('w') === 'm';

  localStorage.setItem('softcraft-theme', theme);

  const holder = document.getElementById('holder');
  const width = mobile ? 390 : 1280;
  const height = mobile ? 780 : 820;
  const scale = mobile ? 1 : 0.5;

  holder.style.width = `${width * scale}px`;
  holder.style.height = `${height * scale}px`;
  document.getElementById('bar').textContent = `${route} · ${theme} · y=${y}`;

  const frame = document.createElement('iframe');
  frame.id = 'f';
  frame.width = width;
  frame.height = height;
  frame.style.cssText = `border:0;display:block;transform:scale(${scale});transform-origin:0 0`;
  frame.onload = () => {
    const win = frame.contentWindow;
    const apply = () => {
      const d = win.document;
      d.documentElement.style.scrollBehavior = 'auto';
      d.body.style.marginTop = y ? `-${y}px` : '';
      d.documentElement.scrollTop = 0;
      if (!d.getElementById('review-hide')) {
        const s = d.createElement('style');
        s.id = 'review-hide';
        s.textContent = '.route-curtains{display:none!important}';
        d.head.appendChild(s);
      }
    };
    [0, 200, 600, 1400].forEach((ms) => setTimeout(apply, ms));
  };
  frame.src = route;
  holder.appendChild(frame);
</script>
</body>
</html>
